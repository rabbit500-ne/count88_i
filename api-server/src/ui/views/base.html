<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}count88{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 0; }
      header { padding: 16px 20px; border-bottom: 1px solid rgba(127,127,127,.3); }
      main { padding: 20px; max-width: 1100px; margin: 0 auto; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .card { border: 1px solid rgba(127,127,127,.3); border-radius: 10px; padding: 14px; }
      .muted { opacity: .7; }
      .btn { border: 1px solid rgba(127,127,127,.5); background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
      .btn:disabled { opacity: .5; cursor: not-allowed; }
      pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </head>
  <body>
    <header>
      <strong>count88</strong>
      <span class="muted">ブラウザ分散計算クライアント（UI）</span>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/client.js"></script>
  </body>
</html>
